name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 001-amazon-shop]
  pull_request:
    branches: [main, develop, 001-amazon-shop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: learnflow-app

jobs:
  # ============================================================================
  # BACKEND TESTS (root-level pytest at learnflow-app/tests/)
  # ============================================================================
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user_service, product_service, order_service, chat_service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install service dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          # Install each service's deps so cross-imports resolve
          for svc in user-service product-service order-service chat-service; do
            if [ -f "app/backend/$svc/requirements.txt" ]; then
              pip install -r "app/backend/$svc/requirements.txt" || true
            fi
          done

      - name: Run unit tests for ${{ matrix.service }}
        working-directory: ${{ env.APP_DIR }}
        env:
          JWT_SECRET: test-secret-key-for-unit-tests-minimum-32-chars-long
          DATABASE_URL: sqlite://
          OPENAI_API_KEY: sk-test-placeholder
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_test_secret
        run: |
          test_file="tests/unit/test_${{ matrix.service }}.py"
          if [ -f "$test_file" ]; then
            pytest "$test_file" -v --tb=short
          else
            echo "No tests for ${{ matrix.service }} (expected $test_file)"
          fi

  # ============================================================================
  # FRONTEND TESTS
  # ============================================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}/app/frontend
        run: npm ci

      - name: Lint
        working-directory: ${{ env.APP_DIR }}/app/frontend
        run: npm run lint || true

      - name: Type check
        working-directory: ${{ env.APP_DIR }}/app/frontend
        run: npx tsc --noEmit || true

      - name: Build
        working-directory: ${{ env.APP_DIR }}/app/frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # ============================================================================
  # DOCKER BUILD (verify all images build)
  # ============================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: learnflow-app/app/backend/user-service
          - service: product-service
            context: learnflow-app/app/backend/product-service
          - service: order-service
            context: learnflow-app/app/backend/order-service
          - service: chat-service
            context: learnflow-app/app/backend/chat-service
          - service: frontend
            context: learnflow-app/app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # SECURITY
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test-backend.result }}" = "failure" ] || \
             [ "${{ needs.test-frontend.result }}" = "failure" ]; then
            echo "::error::CI checks failed"
            exit 1
          fi
          echo "All required checks passed."
