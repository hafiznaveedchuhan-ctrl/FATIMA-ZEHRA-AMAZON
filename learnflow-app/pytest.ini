[pytest]
testpaths = tests app/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    unit: Unit tests (no external services required)
    integration: Integration tests (may require services)
    e2e: End-to-end tests (require all services running)
    slow: Tests that take longer to run
    requires_db: Tests that require database connection
    requires_api: Tests that require running API services
    requires_stripe: Tests that require Stripe API key
    requires_rag: Tests that require Qdrant/RAG service
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
