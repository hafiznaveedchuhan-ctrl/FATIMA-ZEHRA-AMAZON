apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boutique-app-rolebinding
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boutique-app-role
subjects:
  - kind: ServiceAccount
    name: boutique-sa
    namespace: boutique-shop
