apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boutique-devuser-rolebinding
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boutique-devuser-role
subjects:
  - kind: User
    name: dev-user
    apiGroup: rbac.authorization.k8s.io
