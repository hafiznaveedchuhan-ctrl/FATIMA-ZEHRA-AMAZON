apiVersion: v1
kind: Secret
metadata:
  name: boutique-secrets
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
type: Opaque
data:
  # IMPORTANT: Update these values with your own base64-encoded secrets
  # To encode a value: echo -n "value" | base64

  # PostgreSQL Password (default: "postgres")
  POSTGRES_PASSWORD: cG9zdGdyZXM=

  # Database URL (update with your actual connection string)
  # Format: postgresql://user:password@host:port/dbname
  DATABASE_URL: cG9zdGdyZXM6Ly9wb3N0Z3Jlczpwb3N0Z3Jlc0Bwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvYm91dGlxdWVfc2hvcA==

  # JWT Secret (generate a random secret: openssl rand -hex 32)
  # CHANGE THIS TO A RANDOM SECRET IN PRODUCTION!
  JWT_SECRET: ZGZqazhkZmpkajhkZmtqODJkZmpkODJkamZqODJkZmpk

stringData:
  # OpenAI API Key - REPLACE WITH YOUR ACTUAL KEY
  # Get from: https://platform.openai.com/api-keys
  # Format: sk-... (minimum 48 characters)
  OPENAI_API_KEY: "YOUR_OPENAI_API_KEY_HERE"

  # Stripe Secret Key - REPLACE WITH YOUR ACTUAL KEY
  # Get from: https://dashboard.stripe.com/apikeys
  # Format: sk_live_... or sk_test_...
  STRIPE_SECRET_KEY: "YOUR_STRIPE_SECRET_KEY_HERE"

  # Stripe Webhook Secret - REPLACE WITH YOUR ACTUAL SECRET
  # Get from: https://dashboard.stripe.com/webhooks
  # Format: whsec_...
  STRIPE_WEBHOOK_SECRET: "YOUR_STRIPE_WEBHOOK_SECRET_HERE"

# POST-DEPLOYMENT: Replace stringData values with your actual secrets using:
# kubectl create secret generic boutique-secrets -n boutique-shop \
#   --from-literal=OPENAI_API_KEY=sk_xxx \
#   --from-literal=STRIPE_SECRET_KEY=sk_xxx \
#   --from-literal=STRIPE_WEBHOOK_SECRET=whsec_xxx \
#   --dry-run=client -o yaml | kubectl apply -f -
