apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Structured logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log /var/log/nginx/access.log main;

        # Performance optimization
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 20M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml text/javascript
                   application/x-javascript application/xml+rss
                   application/json application/javascript;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
        limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/m;
        limit_req_zone $binary_remote_addr zone=payment:10m rate=50r/m;

        # Upstream service definitions
        upstream user-service {
            least_conn;
            server user-service:8000 max_fails=3 fail_timeout=30s;
        }

        upstream product-service {
            least_conn;
            server product-service:8000 max_fails=3 fail_timeout=30s;
        }

        upstream order-service {
            least_conn;
            server order-service:8000 max_fails=3 fail_timeout=30s;
        }

        upstream chat-service {
            least_conn;
            server chat-service:8000 max_fails=3 fail_timeout=30s;
        }

        # Cache configuration
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
                         max_size=1g inactive=60m use_temp_path=off;

        # Health check endpoint
        server {
            listen 8080;
            server_name _;

            location /health {
                access_log off;
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }

            location /ready {
                access_log off;
                return 200 "READY\n";
                add_header Content-Type text/plain;
            }
        }

        # Main HTTP server
        server {
            listen 80;
            server_name _;

            # Security headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

            # CORS headers
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age "3600" always;

            # Root path
            location / {
                return 200 "NGINX Gateway OK\n";
                add_header Content-Type text/plain;
            }

            # API routes
            location /api/users {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://user-service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_read_timeout 30s;
                proxy_connect_timeout 5s;
            }

            location /api/products {
                limit_req zone=api burst=20 nodelay;
                proxy_cache api_cache;
                proxy_cache_valid 200 10m;
                proxy_cache_bypass $http_cache_control;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                proxy_pass http://product-service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_read_timeout 30s;
                proxy_connect_timeout 5s;
            }

            location /api/orders {
                limit_req zone=api burst=10 nodelay;
                proxy_pass http://order-service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_read_timeout 60s;
                proxy_connect_timeout 5s;
            }

            location /api/payments {
                limit_req zone=payment burst=5 nodelay;
                proxy_pass http://order-service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_read_timeout 60s;
                proxy_connect_timeout 5s;
            }

            location /api/webhooks/stripe {
                limit_req zone=payment burst=5 nodelay;
                proxy_pass http://order-service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_read_timeout 60s;
                proxy_connect_timeout 5s;
            }

            location /api/chat {
                limit_req zone=api burst=10 nodelay;
                proxy_pass http://chat-service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_read_timeout 60s;
                proxy_connect_timeout 5s;
            }

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }

            # Readiness check
            location /ready {
                access_log off;
                return 200 "READY\n";
                add_header Content-Type text/plain;
            }

            # 404 handling
            error_page 404 /404.json;
            location = /404.json {
                internal;
                default_type application/json;
                return 404 '{"error":"Not Found","status":404}';
            }

            # 50x handling
            error_page 500 502 503 504 /50x.json;
            location = /50x.json {
                internal;
                default_type application/json;
                return 500 '{"error":"Internal Server Error","status":500}';
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: nginx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: boutique-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user in alpine
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config-vol
              mountPath: /etc/nginx
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nginx-config-vol
          configMap:
            name: nginx-config
