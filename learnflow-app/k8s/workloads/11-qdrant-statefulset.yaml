apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: vector-database
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: vector-database
spec:
  serviceName: qdrant-service
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      serviceAccountName: boutique-sa
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: qdrant
              containerPort: 6333
              protocol: TCP
          envFrom:
            - configMapRef:
                name: boutique-config
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          livenessProbe:
            httpGet:
              path: /health/live
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
