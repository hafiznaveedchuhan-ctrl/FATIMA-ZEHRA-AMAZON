apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: boutique-shop
  labels:
    app.kubernetes.io/name: boutique-shop
    app.kubernetes.io/component: order-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: boutique-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: order-service
          image: boutique-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: boutique-config
            - secretRef:
                name: boutique-secrets
          env:
            # Stripe configuration from secrets
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: STRIPE_WEBHOOK_SECRET
            # Product service URL for order processing
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: PRODUCT_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
